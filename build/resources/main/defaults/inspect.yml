# CS2-inspired inspect motions. Units are blocks; XYZ rotations are degrees.
# Random pools avoid immediate repeats. Swap Hands (F) inspects; sneak + F swaps normally.
anchor:
  forward: 1.25
  right: 0.57
  up: -0.07
model-scale: 1.24
# /inspect hand: physical skin hand in F5; follows body yaw independently of head pitch.
hand-anchor:
  forward: 0.26
  right: 0.34
  up: -0.8
hand-model-scale: 1.3
reveal-anchor:
  forward: 1.35
  right: 0.0
  up: -0.05
view-range: 0.5
brightness: 15
follow-threshold: 0.015
max-parts: 16
pack-model: true
pack-model-scale: 0.75
aliases:
  metal: IRON_BLOCK
  dark: BLACK_CONCRETE
  handle: POLISHED_BLACKSTONE
  edge: QUARTZ_BLOCK
block-palette:
