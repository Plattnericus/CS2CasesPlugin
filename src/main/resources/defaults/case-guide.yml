# Reward points are server preferences, never currency or promised sale proceeds.
# EV = sum(tier chance * average points in tier). Value = EV / (dealer case + matching key).
# Knife points = rarity points * (0.5 + knife score / 100) * finish multiplier.
# Float, pattern and StatTrak have no extra point premium. Actual drop odds are unchanged.
snapshot: '2026-10-08'
favorite-threshold: 85
rarity-points:
  mil_spec: 1
  restricted: 8
  classified: 40
  covert: 220
  rare_special: 1800
