# Shared finishes (mainly knife finishes). A skin references one with 'finish: <id>'.
#   float: [min, max]   default float range for skins using this finish
#   analysis: <profile> pattern analysis profile from patterns.yml
#   variants:           seed-selected sub-variants (Doppler phases, gems)
#   wearable: false     no float based wear (Vanilla)
#   per-instance-wear:  every copy gets its own scratch layout (pattern is never affected)
finishes:
  vanilla:
    name: ""
    style: solid
    palette: ["#8f969e", "#b4bac1"]
    wearable: false
    patterned: false
  fade:
    name: "Fade"
    style: fade_knife
    palette: ["#f3d64f", "#f39a3c", "#e8508f", "#a347d6", "#5a5ce0"]
    float: [0.00, 0.08]
    analysis: fade
  case_hardened:
    name: "Case Hardened"
    style: case_hardened
    palette: ["#173f9e", "#2f62c8", "#6c5f9a", "#7d6a62", "#9a7f4e", "#b8933f", "#c7a14a", "#d9c27e"]
    float: [0.00, 1.00]
    analysis: case_hardened
  crimson_web:
    name: "Crimson Web"
    style: web
    palette: ["#a3151a", "#8c1216", "#121212"]
    float: [0.06, 0.80]
  slaughter:
