    661: {name: "Tier 1 Blue Gem", tier: 1, color: "#2f6bff"}
    670: {name: "Tier 1 Blue Gem", tier: 1, color: "#2f6bff"}
    321: {name: "Tier 1 Blue Gem", tier: 1, color: "#2f6bff"}
    955: {name: "Tier 1 Blue Gem", tier: 1, color: "#2f6bff"}
    151: {name: "Tier 2 Blue Gem", tier: 2, color: "#4b8bff"}
    168: {name: "Tier 2 Blue Gem", tier: 2, color: "#4b8bff"}
