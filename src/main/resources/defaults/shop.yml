# Case dealer. Spawn one with /csadmin shop spawn, remove with /csadmin shop remove.
currency: EMERALD

villager:
  # empty = name from the language file (shop.npc-name)
  name: ""
  profession: cartographer

# Look of the dealer, both for /csadmin shop spawn and for dealers in villages.
npc:
  # mannequin (a real player model with a skin) or villager
  type: mannequin
  # second line under the name of a mannequin
  # empty = text from the language file (shop.npc-description)
  description: ""
  # Skins: player names, or {texture: "...", signature: "..."} for a fixed skin.
  # A player name is looked up once and the skin is saved in dealer-skins.yml; after that the
  # saved skin is used, even when the account changes its skin. Delete the entry there to refresh it.
  # The mannequin switches to the next skin every skin-interval-seconds.
  skins:
    - Notch
    - jeb_
  skin-interval-seconds: 300
  # Looks at the nearest player, waves at players who walk up, and nods or waves now and then.
  animations: true
  look-range: 8
  gesture-interval-ticks:
    min: 100
    max: 240
  # holds a case in its hand
  hold-case: true

# Dealers in villages. In every third newly generated village one villager becomes the dealer
# above (same type, name and skins). Dealers placed with /csadmin shop spawn always stand still.
natural-spawn:
  enabled: true
  # one dealer in every n-th village, counted per world (1 = every village)
  every: 3
  # never next to another dealer: no second one within this many blocks
  min-distance: 96
  # true = the village dealer walks around like a villager and stops while a player is close
  wander: true

cases:
  default-price: 3
  prices:
    kilowatt_case: 5
    dreams_and_nightmares_case: 4
    snakebite_case: 4
    fracture_case: 4
  # Cases that are not sold at the dealer
  exclude: []

keys:
  case_key: 1
