# CS2-inspired inspect motions. Units are blocks; XYZ rotations are degrees.
# Random pools avoid immediate repeats. Swap Hands (F) inspects; sneak + F swaps normally.
# First-person scene: locked to the view and held by your own skin arms (with the pack).
anchor:
  forward: 1.25
  right: 0.57
  up: -0.07
model-scale: 1.24
# /inspect hand: positions the animated weapon beside the real first-person skin arm and the F5 hand.
hand-anchor:
  forward: 0.9
  right: 0.8
  up: -0.48
hand-model-scale: 1.3
reveal-anchor:
  forward: 1.35
  right: 0.0
  up: -0.05
view-range: 0.5
brightness: 15
follow-threshold: 0.015
max-parts: 16
pack-model: true
pack-model-scale: 0.75
aliases:
  metal: IRON_BLOCK
  dark: BLACK_CONCRETE
  handle: POLISHED_BLACKSTONE
  edge: QUARTZ_BLOCK
block-palette:
