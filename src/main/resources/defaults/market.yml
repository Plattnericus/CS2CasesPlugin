# Payments use real Material.EMERALD items. No virtual wallets or Vault.
enabled: true
emeralds:
  min-price: 1
  max-price: 1000000
  # Sources: storage slots 0..35, optionally offhand. No cursor, armor or containers.
  include-offhand: true
  partial-claims: true
  max-items-per-claim: 2304
# Every sale creates a durable item claim. Collection is explicit and may be partial.
max-listings-per-player: 20
trade-request-seconds: 60
trade-idle-seconds: 300
trade-max-skins: 12
trade-review-millis: 2000
